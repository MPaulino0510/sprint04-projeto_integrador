<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Cliente - AgriTech</title>
</head>
<body>

  <h2>Bem-vindo ao Painel AgriTech</h2>
  <button id="btn-sair">Sair da Conta</button>

  <hr>

  <h3>Alterar Meus Dados de Login</h3>
  <form id="form-editar">
    <div>
      <label for="novo-email">Novo E-mail:</label>
      <input type="email" id="novo-email" required>
    </div>

    <div>
      <label for="nova-senha">Nova Senha:</label>
      <input type="password" id="nova-senha" required>
    </div>

    <button type="submit">Salvar Alterações</button>
  </form>

  <script src="painel.js"></script>
  <link rel="stylesheet" href="painel.css">
</body>
</html>
