<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta - AgriTech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Criar Conta</h2>

  <form id="form-cadastro">
    <div>
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" maxlength="100" required placeholder="Ex: Miguel Pereira">
    </div>

    <div>
      <label for="cpf_cnpj">CPF ou CNPJ:</label>
      <input type="text" id="cpf_cnpj" maxlength="18" required placeholder="Ex: 123.456.789-00">
    </div>

    <div>
      <label for="telefone">Telefone:</label>
      <input type="text" id="telefone" maxlength="15" required placeholder="Ex: (11) 98888-7777">
    </div>

    <div>
      <label for="tipo_cultura">Tipo de Cultura (Opcional):</label>
      <input type="text" id="tipo_cultura" placeholder="Ex: Soja, Milho, Café">
    </div>

    <div>
      <label for="email">E-mail de Acesso:</label>
      <input type="email" id="email" maxlength="100" required placeholder="seu@email.com">
    </div>

    <div>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" maxlength="100" required placeholder="Crie uma senha">
    </div>

    <button type="submit">Cadastrar</button>

    <p class="link-cadastro">
      Já tem conta? <a href="login.html">Fazer login</a>
    </p>
  </form>

  <script src="cadastro.js"></script>

</body>
</html>
