info:
  name: post_compra
  type: http

http:
  method: POST
  url: http://localhost:3000/compra
  body:
    type: json
    data: |-
      {
          "nome_produto": "Semente de trigo 60kg",
          "categoria": "Grãos",
          "quantidade": 8,
          "preco_unitario": "260.00",
          "id_carrinho": 2
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
