<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - AgriTech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Entrar no Sistema</h2>

  <form id="form-login">
    <div>
      <label for="email">E-mail:</label>
      <input type="email" id="email" required placeholder="seu@email.com">
    </div>

    <div>
  <label for="senha">Senha:</label>
  <div class="input-senha-wrapper">
    <input type="password" id="senha" required minlength="6" maxlength="100" placeholder="Mínimo 6 caracteres">
    <button type="button" id="btnToggleSenha" class="btn-olho" aria-label="Mostrar ou ocultar senha">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>
</div>

    <button type="submit">Entrar</button>

    <p class="link-cadastro">
      Ainda não tem conta? <a href="../login/cadastro.html">Criar conta</a>
    </p>
  </form>

  <script src="login.js"></script>

</body>
</html>
