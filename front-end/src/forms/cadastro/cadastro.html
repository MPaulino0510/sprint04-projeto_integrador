<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="login.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
</head>

<body>
    <main class="container">
        <h1>Cadastre-se:</h1>
        <form id="formLogin">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required maxlength="100">
            <label for="cpf_cnpj">CPF / CNPJ</label>
            <input type="text" id="cpf_cnpj" required max="100">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" required max="100">
            <label for="tipo_cultura">Tipo de cultura</label>
            <input type="text" id="tipo_cultura" required max="100">
            <label for="email">E-mail</label>
            <input type="email" id="email" required max="100">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required max="100">

            <div class="acoes">
                <button type="submit">Cadastrar conta</button>
                <a href="index.html" class="botao secundario">Cancelar</a>
            </div>
        </form>
        <p id="mensagem" role="status"></p>
    </main>
</body>

</html>
