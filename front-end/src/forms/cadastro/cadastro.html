<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="cadastro.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
</head>

<body>
    <main class="container">
        <h1>Cadastre-se:</h1>
        <form id="formCadastro">
    <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required maxlength="100" placeholder="Nome completo ou razão social">
    </div>

    <div class="campo">
        <label for="cpf_cnpj">CPF / CNPJ</label>
        <input type="text" id="cpf_cnpj" required maxlength="18" placeholder="000.000.000-00">
    </div>

    <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" required maxlength="15" placeholder="(00) 00000-0000">
    </div>

    <div class="campo">
        <label for="tipo_cultura">Tipo de cultura</label>
        <input type="text" id="tipo_cultura" maxlength="50" placeholder="Ex: Soja, Milho, Café">
    </div>

    <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required maxlength="100" placeholder="seuemail@exemplo.com">
    </div>

    <div class="campo">
    <label for="senha">Senha</label>
    <div class="input-senha-wrapper">
        <input type="password" id="senha" required minlength="6" maxlength="100" placeholder="Mínimo 6 caracteres">
        <button type="button" id="btnToggleSenha" class="btn-olho" aria-label="Mostrar ou ocultar senha">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>
</div>

    <div class="acoes">
        <button type="submit" id="btnCadastrar">Cadastrar conta</button>
        <a href="index.html" class="botao secundario">Cancelar</a>
    </div>
</form>
        <p id="mensagem" role="status"></p>
    </main>
</body>

</html>
