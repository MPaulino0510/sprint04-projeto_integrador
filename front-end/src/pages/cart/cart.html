<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="cart.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Carrinho de compras</title>
</head>
<body>
    <main class="container">
        <header class="topo-carrinho">
            <h1>Meu Carrinho</h1>
            <a href="../landing/landing.html" class="botao secundario">Continuar comprando</a>
        </header>

        <section class="conteudo-carrinho">
            <div class="coluna-principal">
                <div id="listaItens" class="lista-itens"></div>

                <section class="card-endereco" aria-labelledby="titulo-endereco">
                    <h2 id="titulo-endereco">Endereço de Entrega</h2>

                    <div class="grid-endereco">
                        <div class="campo">
                            <label for="cep">CEP *</label>
                            <input type="text" id="cep" maxlength="9" placeholder="00000-000" required>
                            <small id="statusCep" class="status-cep"></small>
                        </div>

                        <div class="campo">
                            <label for="estado">Estado (UF) *</label>
                            <input type="text" id="estado" maxlength="2" placeholder="Ex: SP" required>
                        </div>

                        <div class="campo col-span-2">
                            <label for="logradouro">Logradouro (Rua / Avenida / Estrada) *</label>
                            <input type="text" id="logradouro" maxlength="150" placeholder="Ex: Rua das Flores" required>
                        </div>

                        <div class="campo">
                            <label for="numero">Número *</label>
                            <input type="number" id="numero" min="1" placeholder="Ex: 123" required>
                        </div>

                        <div class="campo">
                            <label for="complemento">Complemento (Opcional)</label>
                            <input type="text" id="complemento" maxlength="50" placeholder="Ex: Sítio Boa Vista, Galpão 2">
                        </div>

                        <div class="campo">
                            <label for="bairro">Bairro *</label>
                            <input type="text" id="bairro" maxlength="100" placeholder="Ex: Zona Rural" required>
                        </div>

                        <div class="campo">
                            <label for="cidade">Cidade *</label>
                            <input type="text" id="cidade" maxlength="50" placeholder="Ex: Ribeirão Preto" required>
                        </div>
                    </div>
                </section>
            </div>

            <aside class="resumo-pedido">
                <h2>Resumo do Pedido</h2>

                <div class="linha-resumo">
                    <span>Quantidade de itens:</span>
                    <strong id="totalItens">0</strong>
                </div>

                <div class="linha-resumo total">
                    <span>Total:</span>
                    <strong id="valorTotal">R$ 0,00</strong>
                </div>

                <div class="campo">
                    <label for="forma_pagamento">Forma de pagamento</label>
                    <select id="forma_pagamento" required>
                        <option value="PIX">PIX</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Boleto Bancário">Boleto Bancário</option>
                    </select>
                </div>

                <button type="button" id="btnFinalizar" class="botao-principal">
                    Finalizar compra
                </button>
            </aside>
        </section>

        <p id="mensagem" role="status"></p>
    </main>
</body>
</html>
